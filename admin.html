<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin • GlitchMango</title><link rel="stylesheet" href="style.css"></head><body><header class="site-nav"><a class="brand" href="/">🥭 GlitchMango</a><nav><a href="/">Site</a><button id="logout" class="link-btn hidden">Log out</button></nav></header><main class="wrap admin"><section id="loginPanel" class="panel narrow"><p class="eyebrow">PRIVATE AREA</p><h1>GlitchMango Admin</h1><p class="muted">Sign in with your Supabase admin account.</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn primary" type="submit">Sign in</button><p id="loginMsg" class="msg"></p></form></section><section id="dashboard" class="hidden"><div class="admin-head"><div><p class="eyebrow">CONTENT CONTROL</p><h1>Article desk</h1></div><button id="newArticle" class="btn primary">+ New article</button></div><div id="adminMsg" class="msg"></div><div class="panel"><div id="articleList" class="admin-list"></div></div><form id="editor" class="panel hidden"><input type="hidden" id="articleId"><div class="form-grid"><label>Title<input id="title" required></label><label>Slug<input id="slug" required></label><label>Category<input id="category" placeholder="Robotics" required></label><label>Status<select id="status"><option value="draft">Draft</option><option value="published">Published</option></select></label></div><label>Excerpt<textarea id="excerpt" rows="3" placeholder="Short description for cards and search engines"></textarea></label><div class="form-grid seo-grid"><label>SEO title <span class="muted">optional</span><input id="seoTitle" maxlength="60" placeholder="Defaults to article title"></label><label>Meta description <span class="muted">optional</span><input id="seoDescription" maxlength="160" placeholder="Defaults to excerpt"></label><label>Canonical URL <span class="muted">optional</span><input id="canonicalUrl" type="url" placeholder="Defaults to article URL"></label><label>Social image <span class="muted">uses cover</span><input id="socialImage" type="text" readonly></label></div><label>Tags <span class="muted">(comma separated)</span><input id="tags" placeholder="arduino, robotics, tutorial"></label><label>Cover image <span class="muted">(optional, max 5 MB)</span><input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><input id="coverImage" type="url" placeholder="Cover image URL" readonly></label><div class="editor-layout"><div><label>Content <span class="muted">(Markdown)</span></label><div class="editor-toolbar"><button type="button" data-md="## ">H2</button><button type="button" data-md="### ">H3</button><button type="button" data-md="**bold**">Bold</button><button type="button" data-md="*italic*">Italic</button><button type="button" data-md="- ">List</button><button type="button" data-md="> ">Quote</button><button type="button" id="insertLink">Link</button><button type="button" id="insertImage">Image</button></div><textarea id="content" rows="22" required placeholder="# Your article

Write in Markdown here..."></textarea></div><div class="preview-panel"><div class="preview-head">LIVE PREVIEW</div><div id="preview" class="markdown"><p class="muted">Start writing to preview your article.</p></div></div></div><div class="buttons"><button class="btn primary" type="submit">Save article</button><button class="btn" type="button" id="previewArticle">👀 Preview</button><button class="btn" type="button" id="cancelEdit">Cancel</button><button class="btn danger" type="button" id="deleteArticle">Delete</button></div><p id="editorMsg" class="msg"></p></form><div id="previewModal" class="preview-modal hidden"><div class="preview-dialog"><button id="closePreview" class="preview-close" type="button">×</button><div id="previewArticleBox"></div></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="admin.js"></script></body></html>
